<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Essensplan" />
  <meta name="theme-color" content="#FAF8F5" />
  <title>Unser Essensplan</title>

  <!-- Eigenes App-Icon für iOS Homescreen (Pastell-Teller SVG) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23DCECE0'/%3E%3Ccircle cx='90' cy='90' r='54' fill='%23FFFFFF' stroke='%239BC2A6' stroke-width='6'/%3E%3Ccircle cx='90' cy='90' r='36' fill='none' stroke='%23DCECE0' stroke-width='3'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            cream: '#FAF8F5',
            card: '#FFFFFF',
            borderWarm: '#EAE5DC',
            sage: {
              bg: '#DCECE0',
              text: '#2B5438',
              border: '#B8D6C0'
            },
            peach: {
              bg: '#FBE5D8',
              text: '#7C3E22',
              border: '#F0C5AD'
            },
            lavender: {
              bg: '#EAE4F7',
              text: '#473670',
              border: '#CFC3EB'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF8F5;
      color: #2D2A26;
      -webkit-tap-highlight-color: transparent;
    }
    /* Verhindert iOS Auto-Zoom beim Fokussieren von Inputs (min 16px) */
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="password"] {
      font-size: 16px !important;
    }
    /* Sanfte Übergänge */
    .fade-in {
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-sage-bg selection:text-sage-text">

  <!-- Initialer Ladebildschirm (prüft bestehenden Login-Status) -->
  <div id="auth-loading" class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-12 h-12 rounded-2xl bg-sage-bg text-sage-text flex items-center justify-center shadow-xs mb-3 animate-pulse">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
        <path d="M7 2v20" />
        <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
      </svg>
    </div>
    <p class="text-sm font-medium text-stone-500">Prüfe Anmeldung...</p>
  </div>

  <!-- Login-Bildschirm (sichtbar, wenn nicht angemeldet) -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white border border-borderWarm rounded-3xl p-6 shadow-sm fade-in">
      <div class="flex flex-col items-center text-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-sage-bg text-sage-text flex items-center justify-center shadow-xs mb-3">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
            <path d="M7 2v20" />
            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
          </svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-stone-800">Unser Essensplan</h1>
        <p class="text-xs text-stone-500 mt-1">Bitte meldet euch einmalig mit euren Zugangsdaten an.</p>
      </div>

      <form id="login-form" class="space-y-3.5" novalidate>
        <div>
          <label for="login-email" class="block text-xs font-semibold text-stone-600 mb-1 pl-1">E-Mail-Adresse</label>
          <input

            type="email"
            autocomplete="email"
            required

          />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-stone-600 mb-1 pl-1">Passwort</label>
          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="w-full bg-[#FAF8F5] focus:bg-white border border-borderWarm focus:border-sage-border rounded-xl px-3.5 py-2.5 text-stone-800 placeholder:text-stone-400 outline-none transition-colors"
          />

        <button

    </div>
  </div>

  <!-- Haupt-App (erst nach erfolgreichem Login sichtbar) -->
  <div id="app-container" class="hidden pb-12">

    <!-- Fixierter Header -->
    <header class="sticky top-0 z-30 bg-[#FAF8F5]/95 backdrop-blur-md border-b border-borderWarm">
      <div class="max-w-xl mx-auto px-4 pt-3 pb-3">
        <!-- Obere Zeile: Titel, Sync-Status, Papierkorb & Logout -->
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-sage-bg text-sage-text flex items-center justify-center shadow-xs">
              <!-- Teller/Besteck Icon -->
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                <path d="M7 2v20" />
                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
              </svg>
            </div>
            <div>
              <h1 class="text-base font-bold tracking-tight text-stone-800 leading-tight">Unser Essensplan</h1>
              <div id="sync-status" class="text-[11px] font-medium text-stone-400 flex items-center gap-1">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>

          <div class="flex items-center gap-1">

          <button
            id="btn-prev-week"
            type="button"
            class="p-2.5 rounded-xl text-stone-600 hover:bg-[#FAF8F5] active:scale-95 transition-all"
            aria-label="Vorherige Woche"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />

          </button>

          <div class="flex flex-col items-center text-center px-2">
            <div class="flex items-center gap-2">
              <span id="week-label-kw" class="text-sm font-bold text-stone-800">KW --</span>
              <span id="today-banner" class="hidden text-[11px] font-semibold px-2 py-0.5 rounded-full bg-sage-bg text-sage-text cursor-pointer">
                Zu Heute
              </span>
            </div>
            <span id="week-label-dates" class="text-xs text-stone-500 font-medium">--.--. – --.--.</span>
          </div>

          <button
            id="btn-next-week"
            type="button"
            class="p-2.5 rounded-xl text-stone-600 hover:bg-[#FAF8F5] active:scale-95 transition-all"
            aria-label="Nächste Woche"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Hauptbereich: 7 Tageskarten -->
    <main id="days-container" class="max-w-xl mx-auto px-4 pt-4 space-y-4">
      <!-- Wird dynamisch per JS befüllt -->
    </main>

  </div>

  <!-- Custom Bestätigungs-Modal (ersetzt confirm()) -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-stone-900/30 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-borderWarm rounded-3xl max-w-sm w-full p-6 shadow-xl fade-in">
      <h2 class="text-lg font-bold text-stone-800 mb-1.5">Woche komplett leeren?</h2>
      <p class="text-sm text-stone-500 mb-6 leading-relaxed">
        Alle eingetragenen Mahlzeiten und Links dieser Kalenderwoche werden für euch beide unwiderruflich gelöscht.
      </p>
      <div class="flex gap-3">
        <button
          id="btn-cancel-clear"
          type="button"
          class="flex-1 py-3 px-4 rounded-xl bg-stone-100 text-stone-700 text-sm font-semibold hover:bg-stone-200 active:scale-98 transition-all"
        >
          Abbrechen
        </button>
        <button
          id="btn-confirm-clear"
          type="button"
          class="flex-1 py-3 px-4 rounded-xl bg-rose-100 text-rose-800 text-sm font-semibold hover:bg-rose-200 active:scale-98 transition-all"
        >
          Ja, leeren

  <!-- Firebase Modular SDK & App-Logik -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // Exakte Firebase-Konfiguration des Nutzers
    const firebaseConfig = {
      apiKey: "AIzaSyB5hgglR0QzIIlpB0O9W7c18Or_h0rbGNc",
      authDomain: "essensplaner-8e1a4.firebaseapp.com",
      projectId: "essensplaner-8e1a4",
      storageBucket: "essensplaner-8e1a4.firebasestorage.app",
      messagingSenderId: "1092863991695",
      appId: "1:1092863991695:web:06ea3ffdebf5e54be7f5fa"
    };

    // Firebase initialisieren
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Sitzung dauerhaft im Browser/Safari speichern
    setPersistence(auth, browserLocalPersistence).catch((err) => {
      console.error('Persistenz-Fehler:', err);
    });

    // Konstanten für Tage & Mahlzeiten
    const DAYS = [
      { key: 'mon', label: 'Montag' },
      { key: 'tue', label: 'Dienstag' },
      { key: 'wed', label: 'Mittwoch' },
      { key: 'thu', label: 'Donnerstag' },
      { key: 'fri', label: 'Freitag' },
      { key: 'sat', label: 'Samstag' },
      { key: 'sun', label: 'Sonntag' }
    ];

    const MEALS = [
      { key: 'breakfast', label: 'Frühstück', icon: '🥐' },
      { key: 'lunch', label: 'Mittagessen', icon: '🥗' },
      { key: 'dinner', label: 'Abendessen', icon: '🍝' }
    ];

    // App-Zustand
    let currentMonday = getMondayOfDate(new Date());
    let weekData = {};
    let unsubscribeSnapshot = null;
    let saveTimeout = null;
    let openLinkInputs = new Set(); // Merkt sich geöffnete Link-Eingabefelder während der Sitzung
    let hasCleanedUpOldWeeks = false;

    // DOM-Elemente
    const authLoadingEl = document.getElementById('auth-loading');
    const loginScreenEl = document.getElementById('login-screen');
    const appContainerEl = document.getElementById('app-container');
    const loginFormEl = document.getElementById('login-form');
    const loginEmailEl = document.getElementById('login-email');
    const loginPasswordEl = document.getElementById('login-password');
    const loginErrorEl = document.getElementById('login-error');
    const btnLoginSubmitEl = document.getElementById('btn-login-submit');

    const daysContainer = document.getElementById('days-container');
    const syncStatusEl = document.getElementById('sync-status');
    const weekLabelKwEl = document.getElementById('week-label-kw');
    const weekLabelDatesEl = document.getElementById('week-label-dates');
    const todayBannerEl = document.getElementById('today-banner');
    const confirmModalEl = document.getElementById('confirm-modal');

    // --- AUTHENTIFIZIERUNG ---

    function getGermanAuthError(code) {
      switch (code) {
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          return 'E-Mail-Adresse oder Passwort ist falsch.';
        case 'auth/invalid-email':
          return 'Bitte gib eine gültige E-Mail-Adresse ein.';
        case 'auth/too-many-requests':
          return 'Zu viele Fehlversuche. Bitte warte einen kurzen Moment.';
        case 'auth/network-request-failed':
          return 'Keine Internetverbindung. Bitte prüfe dein Netz.';
        default:
          return 'Anmeldung fehlgeschlagen. Bitte überprüfe deine Eingaben.';
      }
    }

    loginFormEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErrorEl.classList.add('hidden');

      const email = loginEmailEl.value.trim();
      const password = loginPasswordEl.value;

      if (!email || !password) {
        loginErrorEl.textContent = 'Bitte gib E-Mail-Adresse und Passwort ein.';
        loginErrorEl.classList.remove('hidden');
        return;
      }

      btnLoginSubmitEl.disabled = true;
      btnLoginSubmitEl.textContent = 'Melde an...';

      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, email, password);
        loginPasswordEl.value = '';
      } catch (err) {
        loginErrorEl.textContent = getGermanAuthError(err.code);
        loginErrorEl.classList.remove('hidden');
      } finally {
        btnLoginSubmitEl.disabled = false;
        btnLoginSubmitEl.textContent = 'Anmelden';
      }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
      }
      hasCleanedUpOldWeeks = false;
      await signOut(auth);
    });

    // --- DATUMS- & KALENDERWOCHEN-HELFER ---

    // Gibt den Montag (00:00:00) der Woche eines beliebigen Datums zurück
    function getMondayOfDate(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      date.setDate(diff);
      return date;
    }

    // Formatiert Datum als YYYY-MM-DD (dient als eindeutige Dokument-ID in Firestore)
    function formatIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Formatiert Datum kurz als DD.MM.
    function formatShortDate(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}.${m}.`;
    }

    // Berechnet ISO-Kalenderwoche
    function getISOWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function addDays(d, days) {
      const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      copy.setDate(copy.getDate() + days);
      return copy;
    }

    // Erzeugt leere Standardstruktur für eine Woche
    function createEmptyWeek() {
      const empty = {};
      for (const day of DAYS) {
        empty[day.key] = {};
        for (const meal of MEALS) {
          empty[day.key][meal.key] = {
            mode: 'together', // 'together' oder 'separate'
            together: { text: '', link: '' },
            me: { text: '', link: '' },
            danni: { text: '', link: '' }
          };
        }
      }
      return empty;
    }

    // Führt geladene Daten sauber mit der Standardstruktur zusammen
    function normalizeWeekData(raw) {
      const base = createEmptyWeek();
      if (!raw) return base;
      for (const day of DAYS) {
        if (!raw[day.key]) continue;
        for (const meal of MEALS) {
          const m = raw[day.key][meal.key];
          if (!m) continue;
          base[day.key][meal.key] = {
            mode: m.mode === 'separate' ? 'separate' : 'together',
            together: {
              text: m.together?.text || '',
              link: m.together?.link || ''
            },
            me: {
              text: m.me?.text || '',
              link: m.me?.link || ''
            },
            danni: {
              text: m.danni?.text || '',
              link: m.danni?.link || ''
            }
          };
        }
      }
      return base;
    }

    // --- SYNC & DATENBANK ---

    function setSyncState(state) {
      if (state === 'syncing') {
        syncStatusEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span><span>Speichert...</span>`;
        syncStatusEl.className = 'text-[11px] font-medium text-amber-700 flex items-center gap-1';
      } else if (state === 'saved') {
        syncStatusEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>Live synchronisiert</span>`;
        syncStatusEl.className = 'text-[11px] font-medium text-stone-400 flex items-center gap-1';
      } else if (state === 'error') {
        syncStatusEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500"></span><span>Verbindungsfehler</span>`;
        syncStatusEl.className = 'text-[11px] font-medium text-rose-600 flex items-center gap-1';
      }
    }

    // Automatische Löschung aller Wochen, die älter als 4 Wochen (28 Tage) sind
    async function cleanupOldWeeks() {
      if (hasCleanedUpOldWeeks || !auth.currentUser) return;
      hasCleanedUpOldWeeks = true;

      try {
        const thisMonday = getMondayOfDate(new Date());
        const cutoffDate = addDays(thisMonday, -28); // Alles vor 4 Wochen
        const cutoffIso = formatIsoDate(cutoffDate);

        const snap = await getDocs(collection(db, 'weeks'));
        const deletions = [];
        snap.forEach((docSnap) => {
          // Dokument-ID ist YYYY-MM-DD des jeweiligen Montags -> alphabetischer Vergleich funktioniert exakt
          if (docSnap.id < cutoffIso) {
            deletions.push(deleteDoc(doc(db, 'weeks', docSnap.id)));
          }
        });

        if (deletions.length > 0) {
          await Promise.all(deletions);
        }
      } catch (err) {
        console.error('Fehler beim Bereinigen alter Wochen:', err);
      }
    }

    // Abonniert die aktuell ausgewählte Woche in Echtzeit
    function subscribeToCurrentWeek() {
      if (!auth.currentUser) return;

      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }

      updateHeaderLabels();
      const weekId = formatIsoDate(currentMonday);
      const docRef = doc(db, 'weeks', weekId);

      setSyncState('syncing');

      unsubscribeSnapshot = onSnapshot(
        docRef,
        (snapshot) => {
          // Nur aktualisieren, wenn der Nutzer nicht gerade aktiv in einem Feld tippt
          const activeTag = document.activeElement?.tagName;
          const isTyping = activeTag === 'INPUT';

          const incoming = snapshot.exists() ? normalizeWeekData(snapshot.data().days) : createEmptyWeek();

          if (!isTyping) {
            weekData = incoming;
            renderWeek();
          } else {
            // Im Hintergrund merken, falls ein anderes Feld geändert wurde
            mergeNonFocusedFields(incoming);
          }

          setSyncState('saved');
          cleanupOldWeeks();
        },
        (error) => {
          console.error('Firestore Sync Fehler:', error);
          setSyncState('error');
        }
      );
    }

    // Aktualisiert Felder im DOM, die gerade nicht fokussiert sind (falls Danni zeitgleich tippt)
    function mergeNonFocusedFields(incoming) {
      const activeEl = document.activeElement;
      const activeId = activeEl?.dataset?.fieldId || '';

      for (const day of DAYS) {
        for (const meal of MEALS) {
          const newM = incoming[day.key][meal.key];
          const oldM = weekData[day.key][meal.key];

          // Falls der Modus umgeschaltet wurde, komplett neu zeichnen (sofern nicht dieses Element fokussiert ist)
          if (newM.mode !== oldM.mode) {
            weekData = incoming;
            renderWeek();
            return;
          }

          weekData[day.key][meal.key] = newM;

          const slots = ['together', 'me', 'danni'];
          for (const slot of slots) {
            const textFieldId = `${day.key}-${meal.key}-${slot}-text`;
            const linkFieldId = `${day.key}-${meal.key}-${slot}-link`;

            if (activeId !== textFieldId) {
              const inputEl = document.querySelector(`[data-field-id="${textFieldId}"]`);
              if (inputEl && inputEl.value !== newM[slot].text) {
                inputEl.value = newM[slot].text;
              }
            }
            if (activeId !== linkFieldId) {
              const linkEl = document.querySelector(`[data-field-id="${linkFieldId}"]`);
              if (linkEl && linkEl.value !== newM[slot].link) {
                linkEl.value = newM[slot].link;
              }
            }
          }
        }
      }
    }

    // Speichert die Woche verzögert (Debounce 400ms) oder sofort in Firestore
    function scheduleSave(immediate = false) {
      if (!auth.currentUser) return;

      setSyncState('syncing');
      if (saveTimeout) clearTimeout(saveTimeout);

      const performSave = async () => {
        if (!auth.currentUser) return;
        try {
          const weekId = formatIsoDate(currentMonday);
          await setDoc(doc(db, 'weeks', weekId), {
            mondayIso: weekId,
            updatedAt: Date.now(),
            days: weekData
          });
          setSyncState('saved');
        } catch (err) {
          console.error('Speicherfehler:', err);
          setSyncState('error');
        }
      };

      if (immediate) {
        performSave();
      } else {
        saveTimeout = setTimeout(performSave, 400);
      }
    }

    // --- UI RENDERING ---

    function updateHeaderLabels() {
      const kw = getISOWeekNumber(currentMonday);
      const sunday = addDays(currentMonday, 6);
      weekLabelKwEl.textContent = `KW ${kw}`;
      weekLabelDatesEl.textContent = `${formatShortDate(currentMonday)} – ${formatShortDate(sunday)}${sunday.getFullYear()}`;

      // "Zu Heute"-Badge anzeigen, wenn man nicht in der aktuellen Woche ist
      const actualThisMonday = getMondayOfDate(new Date());
      if (formatIsoDate(currentMonday) !== formatIsoDate(actualThisMonday)) {
        todayBannerEl.classList.remove('hidden');
      } else {
        todayBannerEl.classList.add('hidden');
      }
    }

    // Stellt sicher, dass URLs beim Öffnen ein Protokoll haben
    function normalizeUrl(rawUrl) {
      const trimmed = (rawUrl || '').trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Rendert eine einzelne Eingabezeile (Gericht + Link-Button + optionales Link-Feld)
    function renderMealSlotRow({ dayKey, mealKey, slotKey, badgeText, badgeClass, placeholder, data }) {
      const fieldPrefix = `${dayKey}-${mealKey}-${slotKey}`;
      const hasLink = Boolean((data.link || '').trim());
      const isLinkBoxOpen = openLinkInputs.has(fieldPrefix);
      const validHref = normalizeUrl(data.link);

      return `
        <div class="space-y-1.5">
          <div class="flex items-center gap-2">
            ${badgeText ? `
              <span class="shrink-0 text-[11px] font-bold px-2 py-1 rounded-lg ${badgeClass}">
                ${badgeText}
              </span>
            ` : ''}
            <div class="relative flex-1 flex items-center">
              <input
                type="text"
                data-field-id="${fieldPrefix}-text"
                data-day="${dayKey}"
                data-meal="${mealKey}"
                data-slot="${slotKey}"
                data-prop="text"
                value="${escapeHtml(data.text)}"
                placeholder="${placeholder}"
                class="w-full bg-[#FAF8F5] focus:bg-white border border-transparent focus:border-sage-border rounded-xl px-3 py-2 text-stone-800 placeholder:text-stone-400 outline-none transition-colors"
              />
            </div>

            <!-- Falls ein Link gespeichert ist: Direkt-Öffnen-Button -->
            ${hasLink ? `
              <a
                href="${escapeHtml(validHref)}"
                target="_blank"
                rel="noopener noreferrer"
                title="Rezept öffnen"
                class="shrink-0 p-2 rounded-xl bg-sage-bg text-sage-text hover:opacity-80 active:scale-95 transition-all"
                aria-label="Rezept öffnen"
              >
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
              </a>
            ` : ''}

            <!-- Button zum Ein-/Ausblenden des Rezept-Link-Feldes -->
            <button
              type="button"
              data-action="toggle-link"
              data-prefix="${fieldPrefix}"
              title="Rezept-Link hinzufügen oder bearbeiten"
              class="shrink-0 p-2 rounded-xl border transition-all active:scale-95 ${
                hasLink || isLinkBoxOpen
                  ? 'bg-stone-100 border-stone-200 text-stone-700'
                  : 'bg-transparent border-transparent text-stone-400 hover:bg-stone-100 hover:text-stone-600'
              }"
              aria-label="Rezept-Link bearbeiten"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </button>
          </div>

          <!-- Aufklappbares URL-Feld -->
          ${isLinkBoxOpen ? `
            <div class="flex items-center gap-2 pl-1 fade-in">
              <input
                type="url"
                data-field-id="${fieldPrefix}-link"
                data-day="${dayKey}"
                data-meal="${mealKey}"
                data-slot="${slotKey}"
                data-prop="link"
                value="${escapeHtml(data.link)}"
                placeholder="Rezept-Link einfügen (z.B. chefkoch.de/...)"
                class="flex-1 bg-white border border-borderWarm focus:border-sage-border rounded-xl px-3 py-1.5 text-stone-700 placeholder:text-stone-400 outline-none"
              />
              ${hasLink ? `
                <button
                  type="button"
                  data-action="clear-link"
                  data-day="${dayKey}"
                  data-meal="${mealKey}"
                  data-slot="${slotKey}"
                  class="text-xs font-medium text-rose-500 hover:text-rose-700 px-2 py-1.5"
                >
                  Entfernen
                </button>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderWeek() {
      const todayIso = formatIsoDate(new Date());
      let html = '';

      DAYS.forEach((day, index) => {
        const dayDate = addDays(currentMonday, index);
        const dayIso = formatIsoDate(dayDate);
        const isToday = dayIso === todayIso;

        html += `
          <section class="bg-white rounded-3xl border ${
            isToday ? 'border-sage-border ring-2 ring-sage-bg/70' : 'border-borderWarm'
          } p-4 shadow-2xs transition-all">
            <!-- Tages-Kopfzeile -->
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-borderWarm/70">
              <div class="flex items-center gap-2">
                <h2 class="text-base font-bold text-stone-800">${day.label}</h2>
                ${isToday ? `
                  <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-sage-bg text-sage-text">
                    Heute
                  </span>
                ` : ''}
              </div>
              <span class="text-xs font-semibold text-stone-400">${formatShortDate(dayDate)}</span>
            </div>

            <!-- Die 3 Mahlzeiten -->
            <div class="space-y-4">
              ${MEALS.map((meal) => {
                const mData = weekData[day.key][meal.key];
                const isSeparate = mData.mode === 'separate';

                return `
                  <div class="space-y-2">
                    <!-- Mahlzeit-Titel & Umschalter Zusammen/Getrennt -->
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold text-stone-500 flex items-center gap-1.5">
                        <span>${meal.icon}</span>
                        <span>${meal.label}</span>
                      </span>

                      <!-- Segmented Pill Switch -->
                      <div class="inline-flex rounded-xl bg-[#FAF8F5] p-0.5 border border-borderWarm">
                        <button
                          type="button"
                          data-action="set-mode"
                          data-day="${day.key}"
                          data-meal="${meal.key}"
                          data-mode="together"
                          class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-all ${
                            !isSeparate
                              ? 'bg-sage-bg text-sage-text shadow-2xs'
                              : 'text-stone-400 hover:text-stone-600'
                          }"
                        >
                          Zusammen
                        </button>
                        <button
                          type="button"
                          data-action="set-mode"
                          data-day="${day.key}"
                          data-meal="${meal.key}"
                          data-mode="separate"
                          class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-all ${
                            isSeparate
                              ? 'bg-peach-bg text-peach-text shadow-2xs'
                              : 'text-stone-400 hover:text-stone-600'
                          }"
                        >
                          Getrennt
                        </button>
                      </div>
                    </div>

                    <!-- Eingabebereich je nach Modus -->
                    ${!isSeparate ? `
                      ${renderMealSlotRow({
                        dayKey: day.key,
                        mealKey: meal.key,
                        slotKey: 'together',
                        badgeText: '',
                        badgeClass: '',
                        placeholder: 'Was esst ihr zusammen?',
                        data: mData.together
                      })}
                    ` : `
                      <div class="space-y-2 pl-2 border-l-2 border-borderWarm fade-in">
                        ${renderMealSlotRow({
                          dayKey: day.key,
                          mealKey: meal.key,
                          slotKey: 'me',
                          badgeText: 'Ich',
                          badgeClass: 'bg-peach-bg text-peach-text',
                          placeholder: 'Dein Essen...',
                          data: mData.me
                        })}
                        ${renderMealSlotRow({
                          dayKey: day.key,
                          mealKey: meal.key,
                          slotKey: 'danni',
                          badgeText: 'Danni',
                          badgeClass: 'bg-lavender-bg text-lavender-text',
                          placeholder: 'Dannis Essen...',
                          data: mData.danni
                        })}
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      });

      daysContainer.innerHTML = html;
    }

    // --- EVENT LISTENER (Delegation für optimale Performance auf dem Smartphone) ---

    // Text- und Link-Eingaben abfangen
    daysContainer.addEventListener('input', (e) => {
      const target = e.target;
      if (target.tagName !== 'INPUT') return;

      const { day, meal, slot, prop } = target.dataset;
      if (!day || !meal || !slot || !prop) return;

      weekData[day][meal][slot][prop] = target.value;
      scheduleSave(false);
    });

    // Beim Verlassen eines Link-Feldes neu rendern, damit der "Öffnen"-Button sofort erscheint/aktualisiert wird
    daysContainer.addEventListener('focusout', (e) => {
      const target = e.target;
      if (target.tagName === 'INPUT' && target.dataset.prop === 'link') {
        scheduleSave(true);
        setTimeout(() => renderWeek(), 50);
      }
    });

    // Klicks auf Modus-Schalter und Link-Buttons abfangen
    daysContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const action = btn.dataset.action;

      if (action === 'set-mode') {
        const { day, meal, mode } = btn.dataset;
        if (weekData[day][meal].mode !== mode) {
          weekData[day][meal].mode = mode;
          renderWeek();
          scheduleSave(true);
        }
      } else if (action === 'toggle-link') {
        const prefix = btn.dataset.prefix;
        if (openLinkInputs.has(prefix)) {
          openLinkInputs.delete(prefix);
        } else {
          openLinkInputs.add(prefix);
        }
        renderWeek();
        // Wenn geöffnet, direkt Fokus ins URL-Feld setzen
        if (openLinkInputs.has(prefix)) {
          const urlInput = daysContainer.querySelector(`[data-field-id="${prefix}-link"]`);
          if (urlInput) urlInput.focus();
        }
      } else if (action === 'clear-link') {
        const { day, meal, slot } = btn.dataset;
        weekData[day][meal][slot].link = '';
        openLinkInputs.delete(`${day}-${meal}-${slot}`);
        renderWeek();
        scheduleSave(true);
      }
    });

    // Wochen-Navigation
    document.getElementById('btn-prev-week').addEventListener('click', () => {
      currentMonday = addDays(currentMonday, -7);
      openLinkInputs.clear();
      subscribeToCurrentWeek();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('btn-next-week').addEventListener('click', () => {
      currentMonday = addDays(currentMonday, 7);
      openLinkInputs.clear();
      subscribeToCurrentWeek();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    todayBannerEl.addEventListener('click', () => {
      currentMonday = getMondayOfDate(new Date());
      openLinkInputs.clear();
      subscribeToCurrentWeek();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Manuelles Leeren der aktuellen Woche (Modal)
    document.getElementById('btn-clear-week').addEventListener('click', () => {
      confirmModalEl.classList.remove('hidden');
    });

    document.getElementById('btn-cancel-clear').addEventListener('click', () => {
      confirmModalEl.classList.add('hidden');
    });

    document.getElementById('btn-confirm-clear').addEventListener('click', async () => {
      confirmModalEl.classList.add('hidden');
      weekData = createEmptyWeek();
      openLinkInputs.clear();
      renderWeek();
      try {
        setSyncState('syncing');
        const weekId = formatIsoDate(currentMonday);
        await deleteDoc(doc(db, 'weeks', weekId));
        setSyncState('saved');
      } catch (err) {
        console.error('Fehler beim Löschen der Woche:', err);
        setSyncState('error');
      }
    });

    // App-Start über Auth-Status steuern (erst nach Login Firestore abfragen)
    onAuthStateChanged(auth, (user) => {
      authLoadingEl.classList.add('hidden');

      if (user) {
        loginScreenEl.classList.add('hidden');
        appContainerEl.classList.remove('hidden');
        currentMonday = getMondayOfDate(new Date());
        subscribeToCurrentWeek();
      } else {
        if (unsubscribeSnapshot) {
          unsubscribeSnapshot();
          unsubscribeSnapshot = null;
        }
        appContainerEl.classList.add('hidden');
        loginScreenEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
